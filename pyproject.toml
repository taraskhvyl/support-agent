[project]
name = "support-agent"
version = "0.1.0"
description = "Customer-support agent built from scratch: MCP server + RAG, no agent frameworks"
requires-python = ">=3.11"
dependencies = ["openai", "chromadb", "mcp<2", "streamlit", "python-dotenv"]

[project.scripts]
support-ingest = "support_agent.ingest:main"
support-mcp = "support_agent.mcp_server:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4"]
ignore = ["E501"]
